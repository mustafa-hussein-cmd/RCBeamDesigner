name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP and Locate Project
      run: |
        unzip -q "*.zip" -d extracted_project
        # البحث عن المجلد الفعلي الذي يحتوي على ملفات أندرويد
        GRADLE_DIR=$(find extracted_project -name "gradlew" -exec dirname {} \; | head -n 1)
        if [ -z "$GRADLE_DIR" ]; then
          GRADLE_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
        fi
        echo "Project root found at: $GRADLE_DIR"
        # نقل المحتويات للمجلد الرئيسي للبناء
        cp -r $GRADLE_DIR/* .
        cp -r $GRADLE_DIR/.* . 2>/dev/null || true

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc-beam-designer-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
