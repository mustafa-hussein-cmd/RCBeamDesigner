name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        unzip "*.zip" -d project_files
        find project_files -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1 > target_dir.txt
        TARGET=$(cat target_dir.txt)
        if [ -n "$TARGET" ]; then
          mv $TARGET/* .
          mv $TARGET/.* . 2>/dev/null || true
        fi

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc-beam-designer-apk
        path: |
          app/build/outputs/apk/release/*.apk
          **/build/outputs/apk/**/*.apk
