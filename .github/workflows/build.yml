name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract Project and Fix Dependencies
      run: |
        unzip -q "*.zip" -d extracted_project
        GRADLE_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
        if [ -z "$GRADLE_DIR" ]; then
          GRADLE_DIR=$(find extracted_project -name "app" -exec dirname {} \; | head -n 1)
        fi
        if [ -z "$GRADLE_DIR" ]; then GRADLE_DIR="extracted_project"; fi
        
        cp -r $GRADLE_DIR/* .
        cp -r $GRADLE_DIR/.* . 2>/dev/null || true
        
        # توليد إعدادات توافق مخصصة لإصدار 8.2
        gradle wrapper --gradle-version 8.2
        
        # إصلاح وتحديث إصدار المكونات برمجياً لتجنب تعارض النسخ
        find . -name "build.gradle" -type f -exec sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.2.0/g' {} +
        find . -name "build.gradle.kts" -type f -exec sed -i 's/id("com.android.application") version "[0-9.]*"/id("com.android.application") version "8.2.0"/g' {} +

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Android APK (Clean Build)
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc-beam-designer-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
