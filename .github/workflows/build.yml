name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract Project and Auto-Generate Gradle Wrapper
      run: |
        unzip -q "*.zip" -d extracted_project
        
        # البحث عن المجلد الذي يحتوي على ملف build.gradle أو مجلد app
        GRADLE_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
        if [ -z "$GRADLE_DIR" ]; then
          GRADLE_DIR=$(find extracted_project -name "app" -exec dirname {} \; | head -n 1)
        fi
        if [ -z "$GRADLE_DIR" ]; then
          GRADLE_DIR="extracted_project"
        fi
        
        echo "Project directory identified: $GRADLE_DIR"
        cp -r $GRADLE_DIR/* .
        cp -r $GRADLE_DIR/.* . 2>/dev/null || true
        
        # توليد ملفات الـ Gradle الناقصة تلقائياً لضمان تخطي الخطأ
        gradle wrapper --gradle-version 8.0

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Android APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rc-beam-designer-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
          *.apk
