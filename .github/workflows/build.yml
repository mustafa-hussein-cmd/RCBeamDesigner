name: Build APK Stable
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'zulu'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract Project
      run: |
        unzip -q "*.zip" -d extracted_project
        GRADLE_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
        if [ -z "$GRADLE_DIR" ]; then GRADLE_DIR="extracted_project"; fi
        cp -r $GRADLE_DIR/* .
        cp -r $GRADLE_DIR/.* . 2>/dev/null || true
        gradle wrapper --gradle-version 7.5

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Android APK
      run: ./gradlew assembleDebug --no-daemon
      continue-on-error: true

    - name: Force Upload Any Built APK
      uses: actions/upload-artifact@v4
      with:
        name: rc-beam-designer-apk
        path: |
          **/*.apk
